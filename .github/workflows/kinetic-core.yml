name: Kinetic lyric core
on:
  pull_request:
    paths:
      - 'Assets/VJ/Stage/**'
      - 'Tools/Motion.Tests/**'
      - 'Tools/validate_motion_sources.py'
      - '.github/workflows/kinetic-core.yml'
  push:
    branches: [main, feature/kinetic-lyrics-v1]
permissions:
  contents: read
concurrency:
  group: kinetic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run production C# planning core (not a Unity rendering test)
        run: dotnet run --project Tools/Motion.Tests/Motion.Tests.csproj --configuration Release
      - name: Check integration source invariants
        run: python3 Tools/validate_motion_sources.py
      - name: Check LAN control JavaScript syntax (not a browser test)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          text = Path('Assets/VJ/Stage/Resources/MotionDeckEnhancement.txt').read_text(encoding='utf-8')
          script = re.search(r'<script>(.*?)</script>', text, re.S).group(1)
          Path(os.environ['RUNNER_TEMP'], 'motion-deck.js').write_text(script, encoding='utf-8')
          PY
          node --check "$RUNNER_TEMP/motion-deck.js"
